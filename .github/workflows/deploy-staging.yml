# Deploy til staging (test.tertnesbrass.com) — kjøres manuelt fra Actions-fanen
# med valgfri gren. Staging har egen D1 og R2; prod røres aldri. Vil du ha
# ferske prod-data i staging, kjør `pnpm run staging:refresh` lokalt.
name: Deploy staging

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 3709ec57046e3f629f737cf5b6b88a82

jobs:
  deploy:
    name: Migrer og deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Hent repoet
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Sett opp pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Sett opp Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Installer avhengigheter
        run: pnpm install --frozen-lockfile

      # Miljøet velges ved BYGGETIDSPUNKTET: Cloudflare-vite-pluginen skriver en
      # ferdig flatet config for valgt CLOUDFLARE_ENV til dist/, og wrangler
      # deploy følger den. `--env staging` på deploy-kommandoen er derfor både
      # feil og farlig — uten CLOUDFLARE_ENV her ville PROD blitt deployet.
      - name: Bygg for staging
        env:
          CLOUDFLARE_ENV: staging
        run: pnpm run build

      - name: Migrer staging-D1
        run: pnpm exec wrangler d1 migrations apply tb-notearkiv-staging --env staging --remote

      - name: Deploy staging-Worker
        run: pnpm exec wrangler deploy

      - name: Verifiser staging
        run: curl -sSf -o /dev/null --retry 3 --retry-delay 5 https://test.tertnesbrass.com/
