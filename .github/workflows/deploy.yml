# Deploy til prod ved push til main. Rekkefølgen speiler den manuelle
# deploy-rutinen som gjaldt før automatiseringen:
#   test → backup av D1 → additiv-sjekk av ventende migrasjoner → radtelling →
#   migrer → radtelling igjen (ingen tabell skal krympe) → deploy → verifiser.
# Feiler et steg FØR «Deploy Worker», ligger gammel kode urørt i prod.
#
# NB: Cloudflare Workers Builds (Git-integrasjonen i dashbordet) må være
# FRAKOBLET for tb-notearkiv — ellers deployer den samme push uten migrasjoner
# og uten disse sjekkene, i kappløp med denne workflowen.
name: Deploy prod

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Aldri to deployer i parallell; en ny push venter til den forrige er ferdig.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 3709ec57046e3f629f737cf5b6b88a82

jobs:
  verify:
    name: Typesjekk og test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hent repoet
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Sett opp pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Sett opp Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Installer avhengigheter
        run: pnpm install --frozen-lockfile

      - name: Typesjekk
        run: pnpm exec tsc --noEmit

      - name: Enhetstester
        run: pnpm test

  deploy:
    name: Backup, migrer og deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Hent repoet
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Sett opp pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Sett opp Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Installer avhengigheter
        run: pnpm install --frozen-lockfile

      - name: Bygg
        run: pnpm run build

      - name: Backup av prod-D1 til R2 (før migrering)
        run: |
          pnpm exec wrangler d1 export tb-notearkiv --remote --output pre-deploy.sql
          test -s pre-deploy.sql
          pnpm exec wrangler r2 object put \
            "tb-notearkiv-backup/d1/pre-deploy/$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:8}.sql" \
            --file pre-deploy.sql --remote

      - name: Sjekk at ventende migrasjoner er additive
        run: |
          PENDING=$(bash scripts/pending-migrations.sh tb-notearkiv)
          if [ -n "$PENDING" ]; then
            echo "Ventende migrasjoner:"
            echo "$PENDING"
            # shellcheck disable=SC2086  # én sti per linje, ingen mellomrom i navnene
            bash scripts/check-migrations-additive.sh $PENDING
          else
            echo "Ingen ventende migrasjoner."
          fi

      - name: Radtelling før migrering
        run: bash scripts/d1-rowcount.sh tb-notearkiv | tee /tmp/rows-before.txt

      - name: Migrer prod-D1
        run: pnpm exec wrangler d1 migrations apply tb-notearkiv --remote

      - name: Radtelling etter migrering — ingen tabell skal krympe
        run: |
          bash scripts/d1-rowcount.sh tb-notearkiv | tee /tmp/rows-after.txt
          node scripts/compare-rowcounts.mjs /tmp/rows-before.txt /tmp/rows-after.txt

      - name: Deploy Worker
        run: pnpm exec wrangler deploy

      - name: Verifiser prod
        run: |
          curl -sSf -o /dev/null --retry 3 --retry-delay 5 https://intern.tertnesbrass.com/
          LOC=$(curl -sI https://noter.tertnesbrass.com/prosjekter | tr -d '\r' | grep -i '^location:' | awk '{print $2}')
          echo "noter. omdirigerer til: $LOC"
          [ "$LOC" = "https://intern.tertnesbrass.com/prosjekter" ]

      - name: Varsle Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL er ikke tilgjengelig; varslingen hoppes over."
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA:0:8}"
          if [ "$OUTCOME" = "success" ]; then
            MSG="✅ Deploy til prod OK — intern.tertnesbrass.com kjører nå $SHORT_SHA."
          else
            MSG="❌ Deploy til prod FEILET for $SHORT_SHA — se $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          curl -sS --fail-with-body --retry 3 --retry-all-errors \
            --header "Content-Type: application/json" \
            --data "{\"content\": \"$MSG\"}" \
            "$DISCORD_WEBHOOK_URL"

      # Samme utgivelsesnotat til #dev, nå som «ute i prod» (docs/utgivelser).
      - name: Utgivelsesnotat til Discord (#dev)
        if: success()
        continue-on-error: true
        env:
          DISCORD_DEV_WEBHOOK_URL: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          MODE: prod
          SHA: ${{ github.sha }}
          BRANCH: main
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/discord-release-note.mjs
