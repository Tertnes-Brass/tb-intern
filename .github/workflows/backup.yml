# Nattlig backup, uavhengig av deploy:
#  - D1-dump til R2:   tb-notearkiv-backup/d1/nightly/<dato>.sql  (slettes etter 60 dager, lifecycle-regel)
#  - Filspeil med rclone: tb-notearkiv-files → tb-notearkiv-backup/files-mirror
#    Filer som slettes/overskrives i kilden flyttes til files-deleted/<dato>/
#    (slettes etter 90 dager) i stedet for å forsvinne fra speilet.
# I tillegg har D1 innebygd Time Travel (30 dagers punkt-i-tid-gjenoppretting).
name: Nattlig backup

"on":
  schedule:
    # 02:30 UTC — utenom deploy-tidspunkter og cron-jobben i Workeren (07:00 UTC).
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 3709ec57046e3f629f737cf5b6b88a82

jobs:
  backup:
    name: D1-dump og filspeil
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Hent repoet
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Sett opp pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Sett opp Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Installer avhengigheter
        run: pnpm install --frozen-lockfile

      - name: Eksporter D1 og last opp til R2
        run: |
          pnpm exec wrangler d1 export tb-notearkiv --remote --output nightly.sql
          test -s nightly.sql
          pnpm exec wrangler r2 object put \
            "tb-notearkiv-backup/d1/nightly/$(date -u +%F).sql" \
            --file nightly.sql --remote

      - name: Speil filbucketen med rclone
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: https://3709ec57046e3f629f737cf5b6b88a82.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ]; then
            echo "::warning::R2_BACKUP_ACCESS_KEY_ID mangler; filspeilingen hoppes over (kun D1 ble sikkerhetskopiert)."
            exit 0
          fi
          sudo apt-get update -q
          sudo apt-get install -yq rclone
          rclone sync r2:tb-notearkiv-files r2:tb-notearkiv-backup/files-mirror \
            --backup-dir "r2:tb-notearkiv-backup/files-deleted/$(date -u +%F)" \
            --fast-list --s3-no-check-bucket --stats-one-line -v

      - name: Varsle Discord ved feil
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          curl -sS --fail-with-body --retry 3 --retry-all-errors \
            --header "Content-Type: application/json" \
            --data "{\"content\": \"❌ Nattlig backup FEILET — se $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            "$DISCORD_WEBHOOK_URL"
